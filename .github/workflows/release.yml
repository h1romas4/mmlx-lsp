name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Determine release version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = process.env.GITHUB_REF_TYPE === 'tag'
            ? process.env.GITHUB_REF_NAME.replace(/^v/, '')
            : manifest.version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/.test(version)) {
            throw new Error(`Invalid release version: ${version}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

  vsix:
    needs: metadata
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      VSCE_PUBLISHER: ${{ vars.VSCE_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: wasm
      - run: npm ci
      - name: Cache WASI SDK
        id: wasi-sdk-cache
        uses: actions/cache@v4
        with:
          path: toolchains/wasi-sdk/build/install
          key: wasi-sdk-${{ runner.os }}-${{ runner.arch }}-33.0-0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce
      - name: Install WASI SDK for YM2151 emulation
        if: steps.wasi-sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz
          printf '%s  %s\n' '0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce' "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          mkdir -p toolchains/wasi-sdk/build/install
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C toolchains/wasi-sdk/build/install --strip-components=1
      - name: Prepare extension metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.version = process.env.VERSION.split('-')[0];
          manifest.publisher = process.env.VSCE_PUBLISHER || manifest.publisher || process.env.GITHUB_REPOSITORY_OWNER;
          manifest.repository ??= { type: 'git', url: `https://github.com/${process.env.GITHUB_REPOSITORY}.git` };
          fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
      - name: Package universal VSIX
        shell: bash
        run: |
          mkdir -p release
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--pre-release); fi
          npx --no-install vsce package "${options[@]}" --out "release/mmlx-lsp-${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: release/*.vsix
          if-no-files-found: error

  native:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - run: npm ci
      - run: npm run test:helix
      - name: Test and build native LSP
        if: runner.os != 'Windows'
        run: |
          cargo test --locked --manifest-path server/Cargo.toml --target "$TARGET"
          cargo build --locked --manifest-path server/Cargo.toml --release --target "$TARGET"
      - name: Test and build native LSP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked --manifest-path server/Cargo.toml --target "$env:TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Native LSP tests failed' }
          cargo build --locked --manifest-path server/Cargo.toml --release --target "$env:TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Native LSP build failed' }
      - name: Package Unix binaries and Helix resources
        if: runner.os != 'Windows'
        run: |
          name="mmlx-lsp-${VERSION}-${RELEASE_PLATFORM}"
          staging="release/stage/$name"
          mkdir -p "$staging/bin" "$staging/runtime/grammars" "$staging/runtime/queries/mmlx-mdx"
          cc -O3 -shared -fPIC -std=c11 -I native/tree-sitter/mdx/src native/tree-sitter/mdx/src/parser.c -o "$staging/runtime/grammars/mmlx-mdx.so"
          cp "server/target/$TARGET/release/mmlx-lsp-server" "$staging/bin/"
          cp native/tree-sitter/mdx/queries/highlights.scm "$staging/runtime/queries/mmlx-mdx/"
          cp native/helix/languages.release.toml "$staging/languages.toml"
          cp native/helix/README.md "$staging/README.md"
          cp LICENSE "$staging/LICENSE"
          tar -czf "release/$name.tar.gz" -C release/stage "$name"
      - name: Package Windows binaries and Helix resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "mmlx-lsp-$env:VERSION-$env:RELEASE_PLATFORM"
          $staging = "release/stage/$name"
          New-Item -ItemType Directory -Force "$staging/bin", "$staging/runtime/grammars", "$staging/runtime/queries/mmlx-mdx" | Out-Null
          cl /nologo /O2 /LD /std:c11 /utf-8 /I native/tree-sitter/mdx/src native/tree-sitter/mdx/src/parser.c /link /out:release/mmlx-mdx.dll
          if ($LASTEXITCODE -ne 0) { throw 'Tree-sitter DLL compilation failed' }
          Copy-Item release/mmlx-mdx.dll "$staging/runtime/grammars/"
          Copy-Item "server/target/$env:TARGET/release/mmlx-lsp-server.exe" "$staging/bin/"
          Copy-Item native/tree-sitter/mdx/queries/highlights.scm "$staging/runtime/queries/mmlx-mdx/"
          Copy-Item native/helix/languages.release.toml "$staging/languages.toml"
          Copy-Item native/helix/README.md "$staging/README.md"
          Copy-Item LICENSE "$staging/LICENSE"
          Compress-Archive -Path $staging -DestinationPath "release/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  publish:
    needs: [metadata, vsix, native]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check assets and create checksums
        working-directory: release
        run: |
          ls -laR
          assets=(
            "mmlx-lsp-${VERSION}.vsix"
            "mmlx-lsp-${VERSION}-macos-x64.tar.gz"
            "mmlx-lsp-${VERSION}-macos-arm64.tar.gz"
            "mmlx-lsp-${VERSION}-linux-x64.tar.gz"
            "mmlx-lsp-${VERSION}-windows-x64.zip"
          )
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done
          sha256sum "${assets[@]}" > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        run: |
          prerelease=false
          if [[ "$VERSION" == *-* ]]; then prerelease=true; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --draft --generate-notes --title "$TAG"
          fi
          gh release edit "$TAG" --draft=false --prerelease="$prerelease"