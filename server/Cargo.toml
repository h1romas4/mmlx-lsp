[package]
name = "mmlx-lsp-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
mmlx = { version = "0.2.0", features = ["source-map"] }
rust-i18n = "4"
serde_json = "1"
soundlog = { version = "0.15.0", features = ["mdx"] }

[dev-dependencies]
serde-saphyr = "1"