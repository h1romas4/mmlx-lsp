[package]
name = "mmlx-lsp-server"
version = "0.25.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[features]
emulation = ["dep:ymfm-sys", "dep:rubato"]
mcp = ["dep:rmcp", "dep:schemars", "dep:serde-saphyr", "dep:tokio"]
nanodrive = ["dep:ndsif"]

[[bin]]
name = "mmlx-mcp-server"
path = "src/bin/mmlx-mcp-server.rs"
required-features = ["mcp"]

[[bin]]
name = "mmlx-lsp-server"
path = "src/bin/mmlx-lsp-server.rs"

[[bin]]
name = "mmlx-nanodrive"
path = "src/bin/mmlx-nanodrive.rs"
required-features = ["nanodrive"]

[[bin]]
name = "mmlx-emulator"
path = "src/bin/mmlx-emulator.rs"
required-features = ["emulation"]

[dependencies]
base64 = "0.22"
hound = "3.5"
lsp-server = "0.10"
lsp-types = "0.97"
mmlx = { version = "0.2.0", features = ["source-map"] }
ndsif = { path = "../crates/ndsif", optional = true }
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-async-rw"], optional = true }
schemars = { version = "1", optional = true }
rust-i18n = "4"
serde-saphyr = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundlog = { version = "0.15.0", features = ["mdx"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync"], optional = true }
ymfm-sys = { version = "0.2", optional = true }
rubato = { version = "0.16", default-features = false, optional = true }

[dev-dependencies]
serde-saphyr = "1"