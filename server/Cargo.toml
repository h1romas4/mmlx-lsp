[package]
name = "mmlx-lsp-server"
version = "0.5.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
mmlx = { version = "0.2.0", features = ["source-map"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundlog = { version = "0.15.0", features = ["mdx"] }

[dev-dependencies]
serde-saphyr = "1"