server:
  unsupported_dialect: '未対応の MML 方言 %{dialect} です。対応する方言: %{supported}。'
_version: 1
ui:
  example: 例
  argument_hints: 引数ヒントを表示
mdx:
  voice_definition:
    label: '@ 音色定義'
    syntax: '@<音色番号> = { ... }'
    description: 47 パラメーターを持つ FM 音色を定義します。
  commands:
    t:
      syntax: t<19..4882 BPM>
      description: テンポを BPM で指定します。OPM タイマー用の値へ変換され、全トラック共通のテンポとして適用されます。
      parameters:
        p0: BPM
    '@t':
      syntax: '@t<0..255>'
      description: MDX のテンポ値を直接指定します。BPM ではありません。0 は 1 に補正して適用されます。
      parameters:
        p0: テンポ値
    '@':
      syntax: '@<音色番号/PCM バンク番号>'
      description: FM トラックでは音色番号、PCM トラックでは PDX バンク番号を選択します。FM 音色のレジスター設定は次の発音時に適用されます。
      parameters:
        p0: 音色番号/PCM バンク番号
    q:
      syntax: q<1..8>
      description: キーオフ時刻を音長の `N / 8` で指定します。正確な計算は `floor((note_ticks - 1) * N / 8) + 1` です。`note_ticks` は音長の tick 数です。q8 は音長いっぱいまで発音する設定です。
      parameters:
        p0: ゲート割合
    '@q':
      syntax: '@q<1..256>'
      description: キーオフ時刻を指定します。MDX ゲート値は `256 - N` で、符号付き 8 bit として解釈されます。N が 1..128 の場合は `max(1, note_ticks - N)` でキーオフします。`note_ticks` は音長の tick 数です。N が 129..256 の場合は割合方式になるため、全域が固定 tick 方式ではありません。
      parameters:
        p0: ゲート値
    v:
      syntax: v<0..15>
      description: 段階式の音量を指定します。FM では音色のキャリアに減衰量を反映し、PCM では再生ゲインを更新します。値が大きいほど大きな音量になります。
      parameters:
        p0: 音量
    '@v':
      syntax: '@v<0..127>'
      description: 細かい音量を指定します。MDX へ格納される値は `255 - N` で、下位 7 bit、つまり `127 - N` が直接減衰量になります。値が大きいほど大きな音量になります。
      parameters:
        p0: 音量
    p:
      syntax: p<0..3>
      description: 'パンを設定します。0: 消音、3: 中央。1 は FM で右・PCM で左、2 は FM で左・PCM で右です。出力はトラック種別によって異なります。'
      parameters:
        p0: パン
    o:
      syntax: o<0..8>
      description: 以降の音符のオクターブを設定します。オクターブの変更は MDX の各音符の音高へ反映されます。オクターブと音名の組み合わせが MDX の音高範囲を外れる場合は、コンパイル時にエラーになります。
      parameters:
        p0: オクターブ
    <:
      syntax: <
      description: オクターブを 1 下げます。0 未満には下がりません。単独の MDX コマンドは生成せず、以降の音符の音高を変えます。
    '>':
      syntax: '>'
      description: オクターブを 1 上げます。単独の MDX コマンドは生成せず、以降の音符の音高を変えます。音高範囲を外れる音符は、コンパイル時にエラーになります。
    l:
      syntax: l<音長>
      description: 長さを省略した音符・休符の既定音長を設定します。l4 は全音符 192 tick の `1 / 4`、つまり `192 / 4 = 48` tick です。%は tick 直接指定、.は付点、^と~は音長の加減算です。l だけでは現在の設定を変えません。
      parameters:
        p0: 音長
    (:
      syntax: (
      description: 音量を 1 段階下げます。v 方式では段階番号を減らし、@v 方式では減衰値を増やします。下限では値を維持します。
    ):
      syntax: )
      description: 音量を 1 段階上げます。v 方式では段階番号を増やし、@v 方式では減衰値を減らします。上限では値を維持します。
    D:
      syntax: D<-32767..32767>
      description: 音高に加えるデチューン値を設定します。MDX の符号付き値を FM 音高計算に加算します。半音番号や Hz の直接指定ではありません。
      parameters:
        p0: デチューン
    'y':
      syntax: y<レジスター>,<値>
      description: |-
        OPM レジスターへ直接書き込みます。YM2151 書き込みを即座に行います。

        - **レジスター**: 書き込み先のレジスター番号。0..255 を指定します。0x0f と 0x1b は後続処理用の保持値も更新します。
        - **値**: レジスターへ書き込む値。0..255 を指定します。
      parameters:
        p0: レジスター
        p1: 値
    k:
      syntax: k<0..255 tick>
      description: FM キーオンの遅延 tick 数を設定します。発音のキーオン要求を遅らせます。音符の待ち時間そのものを延長するコマンドではありません。
      parameters:
        p0: キーオン遅延
    w:
      syntax: w<0..31>
      description: FM トラックで OPM ノイズ周波数の下位 5 bit を変更します。0x0f のノイズ有効ビットは維持されるため、このコマンドだけでノイズを有効化しません。有効化は必要に応じて y15,128 などで指定します。
      parameters:
        p0: ノイズ周波数
    F:
      syntax: F<0..12>
      description: PCM トラックの形式・再生周波数を選びます。通常の ADPCM では F0..F4 で約 3.906/5.208/7.812/10.416/15.625 kHz を選択します。PCM8A では F5..F12 も形式・周波数選択に使います。形式は再生モードに応じて判定されます。
      parameters:
        p0: PCM 形式/周波数
    S:
      syntax: S<チャンネル/0..255>
      description: 指定トラックの同期待ちを解除します。A..H は 0..7、P..W は 8..15 へ変換します。対象が W で待機中の場合だけ、その待機を解除します。
      parameters:
        p0: チャンネル
    W:
      syntax: W
      description: このトラックのコマンド進行を同期待ちにします。他トラックの S で解除されるまで次のコマンドへ進みません。待機中もキーオフや LFO などの時刻更新は続きます。
    MP:
      syntax: MP<波形>,<周期>,<深さ>
      description: |-
        ソフトウェア音程 LFO を設定して有効にします。

        - **波形**: 下位 2 bit で波形を選びます。0: のこぎり、1: 矩形、2: 三角、3: 乱数。4..7 は拡張振幅方式になります。
        - **周期**: 音程変調の周期。正数を指定します。波形に応じて MDX 用へ換算され、換算後の値は 16 bit へ収まる必要があります。
        - **深さ**: 音程変調の深さ。波形に応じて MDX 用へ換算され、換算後の値は 16 bit へ収まる必要があります。
      parameters:
        p0: 波形
        p1: 周期
        p2: 深さ
    MPON:
      syntax: MPON
      description: 設定済みのソフトウェア音程 LFO を有効にし、その位相・カウンターを初期状態へ戻します。
    MPOF:
      syntax: MPOF
      description: ソフトウェア音程 LFO を無効にし、現在の音程オフセットを 0 へ戻します。設定値を変更するコマンドではありません。
    MA:
      syntax: MA<波形>,<周期>,<深さ>
      description: |-
        ソフトウェア音量 LFO を設定して有効にします。減衰量が周期的に更新されます。

        - **波形**: 0: のこぎり、1: 矩形、2: 三角、3: 乱数。4..7 も下位 2 bit の波形を使います。
        - **周期**: 音量変調の周期。正数を指定します。MDX 用へ換算され、換算後の値は 16 bit へ収まる必要があります。
        - **深さ**: 音量変調の深さ。MDX 用へ換算され、換算後の値は 16 bit へ収まる必要があります。
      parameters:
        p0: 波形
        p1: 周期
        p2: 深さ
    MAON:
      syntax: MAON
      description: 設定済みのソフトウェア音量 LFO を有効にし、その位相・カウンターを初期状態へ戻します。
    MAOF:
      syntax: MAOF
      description: ソフトウェア音量 LFO を無効にし、現在の音量変調オフセットを 0 へ戻します。
    MD:
      syntax: MD<0..255 tick>
      description: 発音からソフトウェア音程・音量 LFO の開始までの遅延 tick 数を設定します。発音時に遅延カウンターと LFO オフセットを初期化します。
      parameters:
        p0: LFO 遅延
    MH:
      syntax: MH<波形>,<LFRQ>,<PMD>,<AMD>,<PMS>,<AMS>,<キー同期>
      description: |-
        OPM のハードウェア LFO を設定します。周波数・深さの共通レジスターと、その FM チャンネルの感度レジスターを更新します。

        - **波形**: LFO の波形番号。0..3 を指定します。
        - **LFRQ**: LFO の周波数設定値。0..255 を指定します。全 FM チャンネル共通の設定です。
        - **PMD**: 音程変調の深さ。0..255 を指定し、下位 7 bit が MDX へ格納されます。全 FM チャンネル共通の設定です。
        - **AMD**: 音量変調の深さ。0..255 を指定します。全 FM チャンネル共通の設定です。
        - **PMS**: この FM チャンネルの音程変調感度。0..255 を指定し、下位 4 bit が MDX へ格納されます。
        - **AMS**: この FM チャンネルの音量変調感度。0..255 を指定し、下位 4 bit が MDX へ格納されます。
        - **キー同期**: 0 または 1 を指定します。1 では発音時に LFO をリセットします。
      parameters:
        p0: 波形
        p1: LFRQ
        p2: PMD
        p3: AMD
        p4: PMS
        p5: AMS
        p6: キー同期
    MHON:
      syntax: MHON
      description: OPM ハードウェア LFO の感度を、このチャンネルに保持した PMS/AMS へ戻します。共通 LFO の周波数や波形を再設定するコマンドではありません。
    MHOF:
      syntax: MHOF
      description: この FM チャンネルの PMS/AMS を 0 へ書き換え、OPM ハードウェア LFO の影響を止めます。共通 LFO の設定値は保持します。
    L:
      syntax: L
      description: トラック末尾から戻るループ開始位置を指定します。この位置への MDX 終端ループを生成します。[...]N の回数付き繰り返しとは別の指定です。
    '[':
      syntax: '[コマンド列]回数'
      description: コマンド列を繰り返します。MDX の反復スタックで回数と戻り位置を管理します。入れ子は 64 段まで対応しています。
    ']':
      syntax: ']<回数>'
      description: 現在の繰り返しを閉じ、回数を指定します。回数は MDX の 1 byte へ変換されます。終了時に残り回数を減らして先頭へ戻るか、次へ進みます。
      parameters:
        p0: 回数
    /:
      syntax: /
      description: 繰り返しの最後の周回で、この位置から対応する閉じ括弧の先へ抜けます。反復スタックの残り回数が 1 の場合にだけ分岐します。[c4/d4]2 では最後の d4 を省略します。
    _:
      syntax: 音符_音符
      description: 音符間のポルタメントを指定します。例は c4_e4 です。MDX の変化量は音高差と元の音長から計算され、対象の次音符は別の発音として出力されません。発音中の音高オフセットを更新します。
    '&':
      syntax: 音符&音符
      description: 直前の音符のキーオフを抑制します。例は c4&d4 です。前の音符に MDX のキーオフ無効化を付け、その 1 音のキーオフカウンターを停止します。
    '!':
      syntax: '!'
      description: このトラックの以降のコマンドをコンパイルしません。コンパイル処理を打ち切る指定で、MDX の専用停止コマンドではありません。
