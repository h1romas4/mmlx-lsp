<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}' {{cspSource}}; worker-src {{cspSource}} blob:; connect-src {{cspSource}};">
	<link rel="stylesheet" href="{{styleUri}}">
	<title>mmlx</title>
</head>
<body>
	<div class="control-tabs" role="tablist" aria-label="mmlx controls">
		<button id="start-tab" role="tab" aria-selected="true" aria-controls="start-controls" type="button">Get Started</button>
		<button id="voice-tab" role="tab" aria-selected="false" aria-controls="voice-controls" tabindex="-1" type="button">FM Voice</button>
		<button id="playback-tab" role="tab" aria-selected="false" aria-controls="playback-controls" tabindex="-1" type="button">Playback</button>
		<button id="settings-tab" role="tab" aria-selected="false" aria-controls="settings-controls" tabindex="-1" type="button">Settings</button>
	</div>
	<main>
		<section id="start-controls" role="tabpanel" aria-labelledby="start-tab">
			<header class="start-identity"><img src="{{iconUri}}" alt="" width="64" height="64"><h1>mmlx-lsp</h1></header>
			<button id="open-starter" class="start-action" type="button">Open Example MML</button>
		</section>
		<section id="voice-controls" role="tabpanel" aria-labelledby="voice-tab" hidden>
			<header>
				<div class="identity"><h1 id="voice-name" class="empty">Move the cursor to a voice definition.</h1><span id="source"></span></div>
				<div class="summary" id="summary" hidden>
					<label>CON <select id="algorithm" aria-label="CON" disabled></select></label>
					<label>FL <input id="feedback" aria-label="FL" type="number" min="0" max="7" step="1" disabled></label>
					<fieldset id="operator-mask" title="Enable or disable each operator"><legend>OP</legend>
						<label><input type="checkbox" aria-label="Enable OP 1" disabled>OP 1</label>
						<label><input type="checkbox" aria-label="Enable OP 2" disabled>OP 2</label>
						<label><input type="checkbox" aria-label="Enable OP 3" disabled>OP 3</label>
						<label><input type="checkbox" aria-label="Enable OP 4" disabled>OP 4</label>
					</fieldset>
				</div>
				<span id="status" role="status">No voice selected</span>
			</header>
			<details id="algorithms" aria-labelledby="algorithms-heading" open hidden>
				<summary class="algorithm-heading">
					<span id="algorithms-heading">Algorithms</span>
					<span class="algorithm-legend"><span class="carrier-key">Carrier</span><span class="modulator-key">Modulator</span></span>
				</summary>
				<div class="algorithm-grid"></div>
			</details>
			<div id="operators" hidden></div>
			<div id="audio-monitors" class="audio-monitors" role="group" aria-label="Audio monitors" data-state="disconnected">
				<figure class="audio-monitor">
					<figcaption><span>Oscilloscope</span><div class="monitor-settings"><select id="scope-gain" aria-label="Oscilloscope gain" title="Vertical gain"><option value="1">x1</option><option value="4" selected>x4</option><option value="16">x16</option></select><span id="scope-reference">-</span></div></figcaption>
					<canvas id="oscilloscope" role="img" aria-label="Audio waveform synchronized to the reference note"></canvas>
				</figure>
				<figure class="audio-monitor">
					<figcaption><span>Spectrum</span><span id="spectrum-state">Disconnected</span></figcaption>
					<canvas id="spectrum" role="img" aria-label="Audio spectrum, logarithmic frequency in Hz and amplitude in dB"></canvas>
				</figure>
			</div>
			<details id="keyboard" class="p-keyboard is-disconnected" aria-labelledby="keyboard-heading" open>
				<summary class="keyboard-heading">
					<span class="keyboard-heading-content">
						<span class="keyboard-title"><span id="keyboard-heading">Keyboard</span><span id="keyboard-midi-status" class="keyboard-midi-status" role="status" hidden>MIDI-IN</span></span>
						<span class="keyboard-output output-controls"><label>Output <select id="keyboard-mode" aria-label="Keyboard output">
							<option value="emulation">Emulation (ymfm)</option>
							<option value="nanodrive8">NanoDrive8</option>
						</select></label><button id="keyboard-reset" class="output-reset refresh-ports" type="button" title="Reset sound chip" aria-label="Reset sound chip" disabled></button><button id="keyboard-connection" class="output-connection" type="button" title="Connect" aria-label="Connect" aria-pressed="false"></button></span>
					</span>
				</summary>
				<div class="voice-test" role="group" aria-label="Chip State MML">
					<label for="voice-test-mml">Chip State MML</label>
					<input id="voice-test-mml" type="text" maxlength="8192" spellcheck="false" autocomplete="off" value="MH0,200,64,0,5,0,1 ; PMS LFO">
					<button id="voice-test-play" class="transport-button transport-play" type="button" title="Play voice test" aria-label="Play voice test" aria-pressed="false" disabled></button>
				</div>
				<div class="p-keyboard__body" aria-disabled="true">
					<input id="keyboard-pitch-bend" type="range" min="0" max="16383" value="8192" step="1" aria-label="Pitch bend" aria-orientation="vertical" aria-valuetext="0 semitones" title="Pitch bend (+/-2 semitones)" disabled>
					<ul class="p-keyboard__wrapper" aria-label="Piano keyboard"></ul>
				</div>
			</details>
		</section>
		<section id="playback-controls" role="tabpanel" aria-labelledby="playback-tab" hidden>
			<header class="playback-header">
				<div class="playback-identity"><h1 id="playback-source">No MML selected</h1></div>
				<div class="summary playback-options output-controls">
					<label>Output <select id="playback-mode" aria-label="Playback output">
						<option value="emulation">Emulation (ymfm)</option>
						<option value="nanodrive8" disabled>NanoDrive8</option>
					</select></label>
				</div>
			</header>
			<div class="playback-transport" role="group" aria-label="Playback transport">
				<button id="playback-play" class="transport-button transport-play" type="button" title="Play" aria-label="Play" disabled></button>
				<button id="playback-cursor" class="transport-button transport-play transport-cursor" type="button" title="Play from cursor" aria-label="Play from cursor" disabled></button>
				<button id="playback-stop" class="transport-button transport-stop" type="button" title="Stop" aria-label="Stop" disabled></button>
				<button id="playback-loop" class="transport-button transport-loop" type="button" title="Follow MML loop points" aria-label="Follow MML loop points" aria-pressed="false" disabled></button>
				<div class="playback-clock"><span id="playback-time">0:00</span><span id="playback-message" role="status">Unavailable</span></div>
				<label class="playback-volume" title="Volume"><span aria-hidden="true"></span><input id="playback-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Playback volume" disabled></label>
			</div>
			<div id="playback-channels" class="playback-channels" role="group" aria-label="Playback channels"></div>
			<p id="playback-error" role="alert" hidden></p>
		</section>
		<section id="settings-controls" role="tabpanel" aria-labelledby="settings-tab" hidden>
			<header><h1>Settings</h1><span id="build-settings-status" role="status">Loading</span></header>
			<p id="build-settings-source"></p>
			<section class="build-settings connection-settings" aria-labelledby="connection-settings-heading">
				<h2 id="connection-settings-heading">Connection</h2>
				<fieldset id="connection-settings-fields">
					<div class="build-field">
						<label for="serial-connection">NanoDrive8</label>
						<div class="connection-port-controls">
							<select id="serial-connection" disabled><option value="">Not selected</option></select>
							<button id="refresh-serial-ports" class="refresh-ports" type="button" title="Refresh serial ports" aria-label="Refresh serial ports" disabled></button>
							<button id="connect-serial" class="output-connection" type="button" title="Connect NanoDrive8" aria-label="Connect NanoDrive8" aria-pressed="false" disabled></button>
							<span id="serial-settings-status" role="status">Loading</span>
						</div>
					</div>
					<div class="build-field">
						<label for="midi-connection">MIDI-IN</label>
						<div class="connection-port-controls">
							<select id="midi-connection" disabled><option value="">Not selected</option></select>
							<button id="refresh-midi-ports" class="refresh-ports" type="button" title="Refresh MIDI input ports" aria-label="Refresh MIDI input ports" disabled></button>
							<button id="connect-midi" class="output-connection" type="button" title="Connect MIDI input" aria-label="Connect MIDI input" aria-pressed="false" disabled></button>
							<span id="midi-settings-status" role="status">Loading</span>
						</div>
					</div>
				</fieldset>
			</section>
			<section class="build-settings" aria-labelledby="build-settings-heading">
				<h2 id="build-settings-heading">Build</h2>
				<fieldset id="build-settings-fields" disabled>
					<label class="build-field"><span>Output format</span><select data-build-setting="format">
						<option value="both">MDX + VGM</option><option value="mdx">MDX</option><option value="vgm">VGM</option>
					</select></label>
					<label class="build-field"><span>Output directory</span><input data-build-setting="outputDirectory" type="text" required></label>
					<label class="build-field checkbox"><span>Build on save</span><input data-build-setting="onSave" type="checkbox"></label>
					<label class="build-field"><span>PDX file</span><input data-build-setting="pdx" type="text" placeholder="Automatic"></label>
					<label class="build-field"><span>ADPCM mode</span><select data-build-setting="adpcmMode">
						<option value="through">Through</option><option value="resample">Resample</option><option value="lpf">Low-pass filter</option>
					</select></label>
					<label class="build-field"><span>Loop count</span><input data-build-setting="loopCount" type="number" min="0" max="4294967295" step="1" required title="0 preserves native loop points"></label>
					<label class="build-field"><span>Maximum ticks</span><input data-build-setting="maxTicks" type="number" min="1" max="4294967295" step="1" required></label>
				</fieldset>
			</section>
		</section>
	</main>
	<script type="module" nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
