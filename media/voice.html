<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}}; style-src {{cspSource}}; script-src 'nonce-{{nonce}}' {{cspSource}};">
	<link rel="stylesheet" href="{{styleUri}}">
	<title>mmlx (experimental)</title>
</head>
<body>
	<div class="control-tabs" role="tablist" aria-label="mmlx controls">
		<button id="voice-tab" role="tab" aria-selected="true" aria-controls="voice-controls" type="button">FM Voice</button>
		<button id="playback-tab" role="tab" aria-selected="false" aria-controls="playback-controls" tabindex="-1" type="button">Playback</button>
		<button id="settings-tab" role="tab" aria-selected="false" aria-controls="settings-controls" tabindex="-1" type="button">Settings</button>
	</div>
	<main>
		<section id="voice-controls" role="tabpanel" aria-labelledby="voice-tab">
			<header>
				<div class="identity"><h1 id="voice-name" class="empty">Move the cursor to a voice definition.</h1><span id="source"></span></div>
				<div class="summary" id="summary" hidden>
					<label>CON <select id="algorithm" aria-label="CON" disabled></select></label>
					<label>FL <input id="feedback" aria-label="FL" type="number" min="0" max="7" step="1" disabled></label>
					<label>OP <input id="operator-mask" aria-label="OP" type="number" min="0" max="15" step="1" disabled></label>
				</div>
				<span id="status" role="status">No voice selected</span>
			</header>
			<details id="algorithms" aria-labelledby="algorithms-heading" open hidden>
				<summary class="algorithm-heading">
					<span id="algorithms-heading">Algorithms</span>
					<span class="algorithm-legend"><span class="carrier-key">Carrier</span><span class="modulator-key">Modulator</span></span>
				</summary>
				<div class="algorithm-grid"></div>
			</details>
			<div id="operators" hidden></div>
		</section>
		<section id="playback-controls" role="tabpanel" aria-labelledby="playback-tab" hidden>
			<header>
				<h1 id="playback-message" class="empty" role="status">Playback is not ready yet. The music is still dreaming.</h1>
				<div class="summary playback-options">
					<label>Output <select id="playback-mode" aria-label="Playback output">
						<option value="emulation">Emulation</option>
						<option value="nanodrive8">NanoDrive8</option>
					</select></label>
				</div>
			</header>
		</section>
		<section id="settings-controls" role="tabpanel" aria-labelledby="settings-tab" hidden>
			<header><h1>Settings</h1><span id="build-settings-status" role="status">Loading</span></header>
			<p id="build-settings-source"></p>
			<section class="build-settings" aria-labelledby="build-settings-heading">
				<h2 id="build-settings-heading">Build</h2>
				<fieldset id="build-settings-fields" disabled>
					<label class="build-field"><span>Output format</span><select data-build-setting="format">
						<option value="both">MDX + VGM</option><option value="mdx">MDX</option><option value="vgm">VGM</option>
					</select></label>
					<label class="build-field"><span>Output directory</span><input data-build-setting="outputDirectory" type="text" required></label>
					<label class="build-field checkbox"><span>Build on save</span><input data-build-setting="onSave" type="checkbox"></label>
					<label class="build-field"><span>PDX file</span><input data-build-setting="pdx" type="text" placeholder="Automatic"></label>
					<label class="build-field"><span>ADPCM mode</span><select data-build-setting="adpcmMode">
						<option value="through">Through</option><option value="resample">Resample</option><option value="lpf">Low-pass filter</option>
					</select></label>
					<label class="build-field"><span>Loop count</span><input data-build-setting="loopCount" type="number" min="0" max="4294967295" step="1" required title="0 preserves native loop points"></label>
					<label class="build-field"><span>Maximum ticks</span><input data-build-setting="maxTicks" type="number" min="1" max="4294967295" step="1" required></label>
				</fieldset>
			</section>
			<section class="build-settings connection-settings" aria-labelledby="connection-settings-heading">
				<h2 id="connection-settings-heading">Connection</h2>
				<fieldset id="connection-settings-fields" disabled>
					<div class="build-field">
						<label for="serial-connection">NanoDrive8</label>
						<div class="serial-port-controls">
							<select id="serial-connection"><option value="">Not selected</option></select>
							<button id="refresh-serial-ports" type="button" title="Refresh serial ports" aria-label="Refresh serial ports"></button>
						</div>
					</div>
				</fieldset>
				<p id="serial-settings-status" role="status">Loading</p>
			</section>
		</section>
	</main>
	<script type="module" nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
